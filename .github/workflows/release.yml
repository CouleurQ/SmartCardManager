name: Release

# Push a tag like v0.2.0 (on main) to publish a GitHub release with all packages.

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  package:
    needs: ci
    uses: ./.github/workflows/build.yml
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          # a tag like v0.2.0-rc1 is a pre-release
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --title "SmartCardManager ${GITHUB_REF_NAME#v}" --generate-notes "${flags[@]}"
