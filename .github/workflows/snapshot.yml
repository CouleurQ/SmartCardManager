name: Snapshot

# Every push to main: test, then build all packages as downloadable workflow artifacts (no release).

on:
  push:
    branches: [main, feature/ci-release]  # TEMP
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  package:
    uses: ./.github/workflows/build.yml
